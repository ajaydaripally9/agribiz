services:
  db:
    image: postgres:16-alpine
    container_name: fertilizer-db
    restart: always
    environment:
      POSTGRES_DB: fertilizer_shop
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fertilizer_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fertilizer-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_NAME: fertilizer_shop
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
